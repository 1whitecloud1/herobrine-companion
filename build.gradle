plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.139'
}

// 普通构建默认排除电脑控制、JVM 代码注入和联网查找三个功能。
// 手动配置的本地模型连接位于 src/main/java，两种构建均包含；不下载或启动外部程序。
// 需要完整功能时传 -Pfull=true（jar 文件名追加 -full 后缀）。
// 旧的 -PcfSafe=true 仍可用作显式安全版声明。
def fullBuild = providers.gradleProperty("full")
        .map { it.toBoolean() }
        .orElse(false)
def cfSafe = providers.gradleProperty("cfSafe")
        .map { it.toBoolean() }
        .orElse(!fullBuild.get())

version = "${mod_version}-${minecraft_version}-neoforge" + (cfSafe.get() ? "" : "-full")
group = mod_group_id

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        url = uri("https://api.modrinth.com/maven")
        content {
            includeGroup("maven.modrinth")
        }
    }
    maven {
        url = uri("https://maven.saps.dev/minecraft")
        content {
            includeGroup("dev.latvian.mods")
        }
    }
    maven {
        url = uri("https://maven.saps.dev/releases")
        content {
            includeGroup("dev.latvian.apps")
            includeGroup("dev.latvian.mods")
        }
    }
    maven {
        url = uri("https://maven.architectury.dev/")
        content {
            includeGroup("dev.architectury")
        }
    }
    maven {
        url = uri("https://jitpack.io")
        content {
            includeGroup("com.github.rtyley")
        }
    }
    // JEI Maven
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    // ModMaven
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
    mavenLocal()
    mavenCentral()

    // 必须添加这个才能解析 curse.maven 依赖
    maven {
        url = "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    // GeckoLib (终末之诗 3D 模型渲染)
    maven {
        name = "GeckoLib"
        url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
        content {
            includeGroup("software.bernie.geckolib")
        }
    }
}

base {
    archivesName = "Herobrine Companion"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

def kaleidoscopeCompatLocalJar = file("libs/kaleidoscope_compat-2.7.2-neoforge+mc1.21.1.jar")

// Kaleidoscope Cookery 运行版本切换：默认 1.4.1（8266772），
// runClient/build -PcookeryFileId=7966281 切换到 1.3.x 验证兼容。
// 兼容层（HeroKaleidoscopeCompat）用反射处理两版字段差异，须同时对两版可编译。
def cookeryFileId = providers.gradleProperty("cookeryFileId").orElse("8266772").get()

// Patchouli（帕秋莉手册）：同行手册的书本载体，运行时软依赖。
//   gradlew runClient -PwithPatchouli=false   → 检查未安装 Patchouli 的环境（不发放手册）
// 目标为 1.21.1 NeoForge 构建；1.20.1 的 vazkii.patchouli:Patchouli:1.20.1-85-FORGE 不适用于此。
// 代码侧全程不 import vazkii.patchouli.*（见 CompanionGuideService），因此这里只声明 runtimeOnly：
// 编译期不需要它，去掉开关也不会让编译失败。
def patchouliVersion = providers.gradleProperty("patchouliVersion").orElse("1.21.1-93-neoforge").get()
def withPatchouli = providers.gradleProperty("withPatchouli").map { it.toBoolean() }.orElse(true)


// spark 性能分析器：默认不加载，仅性能排查时显式打开。
//   gradlew runClient -PwithSpark=true -PsparkVersion=<NeoForge 1.21.1 版本>
//   gradlew runServer -PwithSpark=true -PsparkVersion=<...>   → 游戏内 /spark
//
// 与 1.20.1 源项目的两点差异（务必注意）：
//  1) 源用 fg.deobf() 包了一层；NeoForge moddev 插件下不需要重映射，**必须去掉**。
//  2) 源默认 sparkVersion = 1.10.53-forge，那是 1.20.1 专用版本线，在 1.21.1 上不可用。
//     这里**不设默认值**：开了 withSpark 却没给 sparkVersion 就直接失败，
//     避免静默解析到一个不兼容的 jar 而在运行期才炸。
// 版本号查 https://modrinth.com/mod/spark/versions?l=neoforge&g=1.21.1
// 纯开发辅助，只加 runtimeOnly，不会进 build/libs 的产物 jar。
def withSpark = providers.gradleProperty("withSpark")
        .map { it.toBoolean() }
        .orElse(false)
if (withSpark.get() && !providers.gradleProperty("sparkVersion").isPresent()) {
    throw new GradleException("withSpark=true 时必须同时给出 -PsparkVersion=<spark 的 NeoForge 1.21.1 版本号>（1.10.53-forge 只支持 1.20.1）。")
}
def sparkVersion = providers.gradleProperty("sparkVersion").orElse("")

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // 👇 新增的二号玩家专属启动项
        client2 {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // 将用户名指定为 Player2
            programArguments.addAll("--username", "Player2")
        }
        // 👆 新增结束

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { 
    srcDirs = ['src/main/resources', 'src/generated/resources']
}

// === 安全版 / 完整版（full）===
// 三个需要独立构建的功能源码放在 src/full/java：
//  1) 本机电脑控制（SafeComputerControlService -> ProcessBuilder + cmd.exe）
//  2) JVM 代码注入（InMemoryJvmCodeCompiler -> 运行时编译 + defineClass）
//  3) 联网查找（WebLookupService -> 白名单站点的 HTTP 搜索/抓取）
// 普通构建（默认、无参数）不加入 src/full/java，改用 src/cfsafe/java 下的惰性 stub
// （同 FQCN、恒不可用），保证 AIService / AIPromptAssembler / AIActionIntentInference
// 等引用方仍可编译，但 jar 内不含任何危险字节码。
// 传 -Pfull=true 时才加入 src/full/java，产物为完整版（jar 文件名带 -full 后缀）。
// JvmCodeResult / JvmCodeStatus 是纯数据类（无危险 API），保留在 src/main/java 供 AIService 使用。
sourceSets {
    main {
        java {
            if (cfSafe.get()) {
                srcDir 'src/cfsafe/java'
            } else {
                srcDir 'src/full/java'
            }
        }
    }
}

// 生成 BuildFlags（两种构建都生成；安全版时 CF_SAFE=true，
// LLMConfig 据此强制关闭对应配置开关，LLMToolTogglesScreen 据此隐藏对应开关行）。
def cfSafeBuildFlagsDir = layout.buildDirectory.dir('generated/cfsafe/java')
def generateCfSafeBuildFlags = tasks.register('generateCfSafeBuildFlags') {
    def outputDir = cfSafeBuildFlagsDir.get().asFile
    // 必须把 cfSafe 声明为输入：否则切换 -Pfull=true / 安全版参数时任务会被判为
    // UP-TO-DATE，沿用上一次生成的 CF_SAFE 值，导致完整版 jar 里 CF_SAFE 恒为 true、
    // 三个功能被自己强制关闭（反之安全版被打开）。
    inputs.property('cfSafe', cfSafe.get())
    outputs.dir(outputDir)
    doLast {
        def flagsFile = new File(outputDir, 'com/whitecloud233/herobrine_companion/BuildFlags.java')
        flagsFile.parentFile.mkdirs()
        flagsFile.setText("""package com.whitecloud233.herobrine_companion;

/**
 * 由 Gradle 构建时生成（generateCfSafeBuildFlags）。
 * CF_SAFE=true 表示当前构建是安全版（普通构建默认即安全版）：
 * 本机电脑控制（cmd 执行）、JVM 代码注入、联网查找已被排除，相关配置开关强制关闭。
 */
public final class BuildFlags {
    public static final boolean CF_SAFE = ${cfSafe.get()};

    private BuildFlags() {
    }
}
""", 'UTF-8')
    }
}
sourceSets.main.java.srcDir(cfSafeBuildFlagsDir)
tasks.named('compileJava') {
    dependsOn generateCfSafeBuildFlags
}

dependencies {


    // GeckoLib - 终末之诗 (poem_of_the_end) 物品的 3D 模型渲染


    // KubeJS (Optional)
    compileOnly("dev.latvian.mods:kubejs-neoforge:2101.7.2-build.379") {
        exclude group: 'dev.latvian.mods', module: 'better-advanced-tooltips'
    }
    compileOnly "dev.latvian.mods:rhino:2101.2.8-build.91"
    if (providers.gradleProperty('withKubeJS').map { it.toBoolean() }.orElse(false).get()) {
        runtimeOnly("dev.latvian.mods:kubejs-neoforge:2101.7.2-build.379") {
            exclude group: 'dev.latvian.mods', module: 'better-advanced-tooltips'
        }
        runtimeOnly "dev.latvian.mods:rhino:2101.2.8-build.91"
    }

    // GeckoLib（终末之诗 3D 模型，可选依赖）
    // 用 -PnoGeckolib=true 关掉 runtimeOnly 以验证「未装 GeckoLib → 回退 2D」路径；
    // 否则 dev 环境恒有 GeckoLib，回退分支永远测不到。
    compileOnly "curse.maven:geckolib-388172:8350073"
    if (!providers.gradleProperty("noGeckolib").map { it.toBoolean() }.orElse(false).get()) {
        runtimeOnly "curse.maven:geckolib-388172:8350073"
    }
    //https://www.curseforge.com/minecraft/mc-mods/geckolib/download/8350073
    compileOnly "curse.maven:farmers-delight-398521:8083481"
    runtimeOnly "curse.maven:farmers-delight-398521:8083481"
//1.3
  //  compileOnly "curse.maven:kaleidoscope-cookery-1309203:7966281"
  //  runtimeOnly "curse.maven:kaleidoscope-cookery-1309203:7966281"
    //1.4.1
    compileOnly "curse.maven:kaleidoscope-cookery-1309203:${cookeryFileId}"
    runtimeOnly "curse.maven:kaleidoscope-cookery-1309203:${cookeryFileId}"
    //https://www.curseforge.com/minecraft/mc-mods/kaleidoscope-cookery/download/8266772 (1.4.1)
    //https://www.curseforge.com/minecraft/mc-mods/kaleidoscope-cookery/download/7966281 (1.3.x)
 //   compileOnly files(kaleidoscopeCompatLocalJar)
  //  runtimeOnly files(kaleidoscopeCompatLocalJar)
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    // at runtime, use the full JEI jar for NeoForge (only for dev environment)
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    compileOnly "top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1:api"
    runtimeOnly "top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1"


    // === spark 性能分析器（仅 -PwithSpark=true 时加载）===
    // NeoForge moddev 下不需要 fg.deobf 重映射，直接按坐标引入即可。
    // 四个 run 配置（client/client2/server/data）都在 neoForge.runs 里声明，
    // runtimeOnly 会一并带上，游戏内命令前缀：客户端 /sparkc，服务端 /spark。
    if (withSpark.get()) {
        runtimeOnly "maven.modrinth:spark:${sparkVersion.get()}"
    }

    // === Patchouli（帕秋莉手册，软依赖）===
    // only 运行时需要：本模组不 import 任何 vazkii.patchouli.* 类型，
    // 手册物品与 patchouli:book 数据组件都按注册名查表取得。
    if (withPatchouli.get()) {
        runtimeOnly "maven.modrinth:patchouli:${patchouliVersion}"
    }
}



var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    // NeoForge reads UTF-8; Windows' default encoding can corrupt the template's Chinese comments.
    filteringCharset = 'UTF-8'
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.named('processResources', ProcessResources) {
    exclude '**/*.bak'
    includeEmptyDirs = false
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(JavaExec).configureEach {
    systemProperty "file.encoding", "UTF-8"
}

// 独立运行快速回归，不解析仅供游戏启动的 runtimeOnly 模组。
// 回归入口全部是普通 main 类，不依赖 JUnit 下载，也不读取被 .gitignore 忽略的 scripts/。
 sourceSets {
    regression {
        java.setSrcDirs(['src/test/java'])
        java.include '**/*Checks.java'
        resources.setSrcDirs(['src/test/resources'])
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath = output + compileClasspath
    }
    test {
        java.exclude '**/*Checks.java'
    }
}

tasks.register('verifyEndRing', JavaExec) {
    group = 'verification'
    dependsOn tasks.named('regressionClasses')
    mainClass = 'com.whitecloud233.herobrine_companion.entity.logic.event.EndRingRegressionChecks'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    classpath = sourceSets.regression.runtimeClasspath
    systemProperty 'log4j.configurationFile', 'log4j2-regression.xml'
}
tasks.named('check') { dependsOn 'verifyEndRing' }

tasks.register('verifyCombatPursuit', JavaExec) {
    group = 'verification'
    description = 'Verify ground combo continuation, flight escape and safe melee landing.'
    dependsOn tasks.named('regressionClasses')
    mainClass = 'com.whitecloud233.herobrine_companion.compat.epicfight.CombatPursuitChecks'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    classpath = sourceSets.regression.output
    args projectDir.absolutePath
}
tasks.named('check') { dependsOn 'verifyCombatPursuit' }

tasks.register('verifyProtectionAndEndRing', JavaExec) {
    group = 'verification'
    description = 'Verify protection UI sync and permanent End Ring story positioning.'
    dependsOn tasks.named('regressionClasses')
    mainClass = 'com.whitecloud233.herobrine_companion.regression.ProtectionAndEndRingChecks'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    classpath = sourceSets.regression.output
    args projectDir.absolutePath
}
tasks.named('check') { dependsOn 'verifyProtectionAndEndRing' }

tasks.register('verifyClientSyncAudit', JavaExec) {
    group = 'verification'
    description = 'Verify reward snapshots, UI acknowledgements, quest cloning and connection cleanup.'
    dependsOn tasks.named('regressionClasses')
    mainClass = 'com.whitecloud233.herobrine_companion.regression.ClientSyncAuditChecks'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    classpath = sourceSets.regression.output
    args projectDir.absolutePath
}
tasks.named('check') { dependsOn 'verifyClientSyncAudit' }

tasks.register('verifyTranslationArguments', JavaExec) {
    group = 'verification'
    description = 'Check translation argument types to prevent system_chat encoding failures.'
    dependsOn tasks.named('regressionClasses')
    mainClass = 'com.whitecloud233.herobrine_companion.network.TranslationArgumentChecks'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    classpath = sourceSets.regression.runtimeClasspath
    maxHeapSize = '2g'
    systemProperty 'log4j.configurationFile', 'log4j2-regression.xml'
    args sourceSets.main.java.srcDirs.findAll { it.exists() }.collect { it.absolutePath }
}
tasks.named('check') { dependsOn 'verifyTranslationArguments' }

tasks.register('verifySystemChatCodec', JavaExec) {
    group = 'verification'
    description = 'Round-trip system_chat packets through the vanilla codec.'
    dependsOn tasks.named('regressionClasses')
    mainClass = 'com.whitecloud233.herobrine_companion.network.SystemChatCodecChecks'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    classpath = sourceSets.regression.runtimeClasspath
    classpath += files(tasks.named('createMinecraftArtifacts').flatMap { it.resourcesArtifact })
    systemProperty 'log4j.configurationFile', 'log4j2-regression.xml'
}
tasks.named('check') { dependsOn 'verifySystemChatCodec' }

tasks.register('verifyTerrainEditTasks', JavaExec) {
    group = 'verification'
    description = 'Verify inherited terrain task registration and callback cleanup on the NeoForge bus.'
    dependsOn tasks.named('regressionClasses')
    mainClass = 'com.whitecloud233.herobrine_companion.world.terrain.TerrainEditTaskChecks'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    classpath = sourceSets.regression.runtimeClasspath
    classpath += files(tasks.named('createMinecraftArtifacts').flatMap { it.resourcesArtifact })
    systemProperty 'log4j.configurationFile', 'log4j2-regression.xml'
}

tasks.named('check') { dependsOn 'verifyTerrainEditTasks' }

