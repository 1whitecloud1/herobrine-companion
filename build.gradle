plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.139'
}

version = "${mod_version}-${minecraft_version}-neoforge"
group = mod_group_id

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        url = uri("https://api.modrinth.com/maven")
        content {
            includeGroup("maven.modrinth")
        }
    }
    maven {
        url = uri("https://maven.saps.dev/minecraft")
        content {
            includeGroup("dev.latvian.mods")
        }
    }
    maven {
        url = uri("https://maven.saps.dev/releases")
        content {
            includeGroup("dev.latvian.apps")
            includeGroup("dev.latvian.mods")
        }
    }
    maven {
        url = uri("https://maven.architectury.dev/")
        content {
            includeGroup("dev.architectury")
        }
    }
    maven {
        url = uri("https://jitpack.io")
        content {
            includeGroup("com.github.rtyley")
        }
    }
    // JEI Maven
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    // ModMaven
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
    mavenLocal()
    mavenCentral()

    // 必须添加这个才能解析 curse.maven 依赖
    maven {
        url = "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

base {
    archivesName = "Herobrine Companion"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

//def epicFightArtifact = "curse.maven:epic-fight-mod-405076:${project.epicfight_file_id}"
//ext.epicFightArtifact = epicFightArtifact
def waveyCapesLocalJar = file("libs/waveycapes-neoforge-1.9.2-mc1.21.1.jar")
def kaleidoscopeCompatLocalJar = file("libs/kaleidoscope_compat-2.7.2-neoforge+mc1.21.1.jar")

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // 👇 新增的二号玩家专属启动项
        client2 {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // 将用户名指定为 Player2
            programArguments.addAll("--username", "Player2")
        }
        // 👆 新增结束

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { 
    srcDirs = ['src/main/resources', 'src/generated/resources']
}

//apply from: "$rootDir/gradle/epicfight-compat.gradle"

dependencies {


    // KubeJS (Optional)
    compileOnly("dev.latvian.mods:kubejs-neoforge:2101.+") {
        exclude group: 'dev.latvian.mods', module: 'better-advanced-tooltips'
