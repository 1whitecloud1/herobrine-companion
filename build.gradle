buildscript {
    repositories {
        // 优先检查本地和国内镜像
        mavenLocal()
        maven { url = uri("https://maven.aliyun.com/repository/public/") }
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
        // 添加 Gradle 插件仓库以获取 Shadow 插件
        maven { url = "https://plugins.gradle.org/m2/" }
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '[6.0.16,6.2)', changing: true
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'


    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.spongepowered.mixin'
apply plugin: 'eclipse'
apply plugin: 'maven-publish'
apply plugin: 'java'


version = mod_version
group = mod_group_id
archivesBaseName = "${mod_name}-${minecraft_version}-forge"


java.toolchain.languageVersion = JavaLanguageVersion.of(17)

def enableAccessoriesRuntime = providers.gradleProperty("enableAccessoriesRuntime")
        .map { it.toBoolean() }
        .orElse(false)
