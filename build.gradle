    compileOnly "dev.latvian.mods:rhino:2101.+"
    runtimeOnly "dev.latvian.mods:rhino:2101.+"

/*   if (enableEpicFightCompile) {
        compileOnly epicFightArtifact
    }
    if (enableEpicFightCompile && enableEpicFightDevRuntime) {
        runtimeOnly epicFightArtifact
    }
*/

    runtimeOnly files(waveyCapesLocalJar)

    compileOnly "curse.maven:accessories-mod-938917:7583320"
    runtimeOnly "curse.maven:accessories-mod-938917:7583320"

    compileOnly "curse.maven:cloth-config-mod-348521:5729127"
    runtimeOnly "curse.maven:cloth-config-mod-348521:5729127"

    compileOnly "curse.maven:farmers-delight-398521:8083481"
    runtimeOnly "curse.maven:farmers-delight-398521:8083481"

    compileOnly "curse.maven:kaleidoscope-cookery-1309203:7966281"
    runtimeOnly "curse.maven:kaleidoscope-cookery-1309203:7966281"

    compileOnly files(kaleidoscopeCompatLocalJar)
    runtimeOnly files(kaleidoscopeCompatLocalJar)

    compileOnly "curse.maven:simplehats-mod-631990:5970513"
    runtimeOnly "curse.maven:simplehats-mod-631990:5970513"

    compileOnly "curse.maven:owo-lib-mod-532610:6785734"
    runtimeOnly "curse.maven:owo-lib-mod-532610:6785734"

    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    // at runtime, use the full JEI jar for NeoForge (only for dev environment)
