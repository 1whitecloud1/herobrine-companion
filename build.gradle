buildscript {
    repositories {
        // 优先检查本地和国内镜像
        mavenLocal()
        maven { url = uri("https://maven.aliyun.com/repository/public/") }
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
        // 添加 Gradle 插件仓库以获取 Shadow 插件
        maven { url = "https://plugins.gradle.org/m2/" }
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '[6.0.16,6.2)', changing: true
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'


    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.spongepowered.mixin'
apply plugin: 'eclipse'
apply plugin: 'maven-publish'
apply plugin: 'java'


// 安全版/完整版开关：普通构建（不带参数）默认就是安全版，排除
//   1) 本机电脑控制（cmd 执行）
//   2) JVM 代码注入
//   3) 联网查找（web_lookup）
//   4) 本地模型（运行时下载 llama.cpp 推理引擎/GGUF 模型并启动 llama-server 进程）
// 四个功能；需要完整功能时显式传 -Pfull=true（产物 jar 文件名追加 -full 后缀，避免与普通构建混淆）。
// 旧的 -PcfSafe=true 仍可用作显式安全版声明（默认值已翻转：cfSafe = !full）。
def fullBuild = providers.gradleProperty("full")
        .map { it.toBoolean() }
        .orElse(false)
def cfSafe = providers.gradleProperty("cfSafe")
        .map { it.toBoolean() }
        .orElse(!fullBuild.get())

version = mod_version + (cfSafe.get() ? "" : "-full")
group = mod_group_id
archivesBaseName = "${mod_name}-${minecraft_version}-forge"


java.toolchain.languageVersion = JavaLanguageVersion.of(17)

def enableAccessoriesRuntime = providers.gradleProperty("enableAccessoriesRuntime")
        .map { it.toBoolean() }
        .orElse(false)

