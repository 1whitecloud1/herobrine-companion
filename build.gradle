println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                "${mod_id}" {
                    source sourceSets.main
                    //if (enableEpicFightCompat.get()) {
                    //    source sourceSets.epicfightCompat
                    //}
                }
            }
        }
        client { property 'forge.enabledGameTestNamespaces', mod_id }
        // 👇 新增的第二个客户端配置
        client2 {
            parent runs.client // 继承 client 的所有基础设置
            taskName 'runClient2' // 在 IDEA 中显示的运行配置名称
            // 强制指定第二个玩家的名字和 UUID，防止数据冲突
            args '--username', 'PlayerB', '--uuid', '22222222-2222-2222-2222-222222222222'
        }
        server { property 'forge.enabledGameTestNamespaces', mod_id; args '--nogui' }
        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

mixin {
    add sourceSets.main, "herobrine_companion.refmap.json"
    config "herobrine_companion.mixins.json"
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

repositories {
    flatDir {
        dir 'libs'
    }
    maven {
        name = "Local Project Maven"
        url = uri("${projectDir}/local-maven")
    }
    maven {
        name = "Curse Maven"
        url = "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        // location of the maven that hosts JEI files since January 2023
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
        content {
            includeGroup "mezz.jei"
            includeGroup "vazkii.patchouli"
        }
    }
    maven {
        // location of a maven mirror for JEI files, as a fallback
        name = "ModMaven"
        url = "https://modmaven.dev"
        content {
            includeGroup "mezz.jei"
            includeGroup "vazkii.patchouli"
        }
    }
    maven {
        url "https://maven.latvian.dev/releases"
        content {
            includeGroup "dev.latvian.mods"
            includeGroup "dev.latvian.apps"
        }
    }
    maven {
        url = "https://maven.architectury.dev"
        content {
            includeGroup "dev.architectury"
        }
    }
    maven {
        url = "https://maven.createmod.net"
        content {
            includeGroup "net.createmod.ponder"
            includeGroup "dev.engine-room.flywheel"
        }
    }
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
        content {
            includeGroup "dev.emi"
        }
    }

    // 必须让 Gradle 优先在这里找 Architectury，而不是去阿里云找
    maven { url = "https://maven.architectury.dev/" }

    // KubeJS 官方库
    maven { url = "https://maven.saps.dev/minecraft" }

    // 3. Minecraft 官方库
    maven {
        name = 'Minecraft'
        url = 'https://libraries.minecraft.net/'
    }

    // 4. Forge 官方库
    maven { url = 'https://maven.minecraftforge.net/' }

    // CurseMaven
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }

    // Curios Maven
    maven {
        name = "Curios Maven"
        url = "https://maven.theillusivec4.top/"
    }

    // 6. 中央仓库
    mavenCentral()
}

