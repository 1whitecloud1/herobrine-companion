println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                "${mod_id}" {
                    source sourceSets.main
                    //if (enableEpicFightCompat.get()) {
                    //    source sourceSets.epicfightCompat
                    //}
                }
            }
        }
        client { property 'forge.enabledGameTestNamespaces', mod_id }
        // 👇 新增的第二个客户端配置
        client2 {
            parent runs.client // 继承 client 的所有基础设置
            taskName 'runClient2' // 在 IDEA 中显示的运行配置名称
            // 强制指定第二个玩家的名字和 UUID，防止数据冲突
            args '--username', 'PlayerB', '--uuid', '22222222-2222-2222-2222-222222222222'
        }
        server { property 'forge.enabledGameTestNamespaces', mod_id; args '--nogui' }
        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

mixin {
    add sourceSets.main, "herobrine_companion.refmap.json"
    config "herobrine_companion.mixins.json"
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

// === 安全版 / 完整版（full）===
// 四个会被 CurseForge 静态扫描或玩家安全审查标记的功能源码放在独立的 src/full/java：
//  1) 本机电脑控制（SafeComputerControlService -> ProcessBuilder + cmd.exe）
//  2) JVM 代码注入（InMemoryJvmCodeCompiler -> 运行时编译 + defineClass）
//  3) 联网查找（WebLookupService -> 白名单站点的 HTTP 搜索/抓取）
//  4) 本地模型（LocalModelLauncher -> 运行时下载 llama.cpp 引擎/GGUF 模型并启动进程）
// 普通构建（默认、无参数）不加入 src/full/java，改用 src/cfsafe/java 下的惰性 stub
// （同 FQCN、恒不可用），保证 AIService / AIPromptAssembler / AIActionIntentInference
// 等引用方仍可编译，但 jar 内不含任何危险字节码。
// 传 -Pfull=true 时才加入 src/full/java，产物为完整版（jar 文件名带 -full 后缀）。
// JvmCodeResult / JvmCodeStatus 是纯数据类（无危险 API），保留在 src/main/java 供 AIService 使用。
sourceSets {
    main {
        java {
            if (cfSafe.get()) {
                srcDir 'src/cfsafe/java'
            } else {
                srcDir 'src/full/java'
            }
        }
    }
}

// 生成 BuildFlags（两种构建都生成；安全版时 CF_SAFE=true，
// LLMConfig 据此强制关闭对应配置开关，LLMToolTogglesScreen 据此隐藏对应开关行）。
def cfSafeBuildFlagsDir = layout.buildDirectory.dir('generated/cfsafe/java')
def generateCfSafeBuildFlags = tasks.register('generateCfSafeBuildFlags') {
    def outputDir = cfSafeBuildFlagsDir.get().asFile
    // 必须把 cfSafe 声明为输入：否则切换 -Pfull=true / 安全版参数时任务会被判为
    // UP-TO-DATE，沿用上一次生成的 CF_SAFE 值，导致完整版 jar 里 CF_SAFE 恒为 true、
    // 三个功能被自己强制关闭（反之安全版被打开）。
    inputs.property('cfSafe', cfSafe.get())
    outputs.dir(outputDir)
    doLast {
        def target = new File(outputDir, 'com/whitecloud233/modid/herobrine_companion/BuildFlags.java')
        target.parentFile.mkdirs()
        target.text = """package com.whitecloud233.modid.herobrine_companion;

/**
 * 由 Gradle 构建时生成（generateCfSafeBuildFlags）。
 * CF_SAFE=true 表示当前构建是安全版（普通构建默认即安全版）：
 * 本机电脑控制（cmd 执行）、JVM 代码注入、联网查找已被排除，相关配置开关强制关闭。
 */
public final class BuildFlags {
    public static final boolean CF_SAFE = ${cfSafe.get()};

    private BuildFlags() {
    }
}
"""
    }
}
sourceSets.main.java.srcDir(cfSafeBuildFlagsDir)
tasks.named('compileJava') {
    dependsOn generateCfSafeBuildFlags
}

