    // KubeJS 官方库
    maven { url = "https://maven.saps.dev/minecraft" }

    // 3. Minecraft 官方库
    maven {
        name = 'Minecraft'
        url = 'https://libraries.minecraft.net/'
    }

    // 4. Forge 官方库
    maven { url = 'https://maven.minecraftforge.net/' }

    // CurseMaven
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }

    // Curios Maven
    maven {
        name = "Curios Maven"
        url = "https://maven.theillusivec4.top/"
    }

    // 6. 中央仓库
    mavenCentral()
}

// 定义 shade 配置用于独立打包依赖
configurations {
    shade
    implementation.extendsFrom shade
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    // 同行手册使用 Patchouli 的数据驱动书本；发布时仍为可选依赖。
    // runClient -PwithPatchouli=false 可检查未安装 Patchouli 的环境。
    if (providers.gradleProperty("withPatchouli").map { it.toBoolean() }.orElse(true).get()) {
        runtimeOnly fg.deobf("vazkii.patchouli:Patchouli:1.20.1-85-FORGE")
    }
  //  compileOnly fg.deobf("local.libs:kaleidoscope_end:1.0.3-forge+mc1.20.1")
   // runtimeOnly fg.deobf("local.libs:kaleidoscope_end:1.0.3-forge+mc1.20.1")
   // compileOnly fg.deobf("local.libs:kaleidoscope_compat:2.4.3-forge+mc1.20.1")
  //  runtimeOnly fg.deobf("local.libs:kaleidoscope_compat:2.4.3-forge+mc1.20.1")
   // kaleidoscopecookery-1.3.0-forge+mc1.20.1
  //compileOnly fg.deobf("curse.maven:kaleidoscope-cookery-1309203:7966280")
  //  runtimeOnly fg.deobf("curse.maven:kaleidoscope-cookery-1309203:7966280")
// kaleidoscopecookery-1.4.1
      compileOnly fg.deobf("curse.maven:kaleidoscope-cookery-1309203:8266769")
     runtimeOnly fg.deobf("curse.maven:kaleidoscope-cookery-1309203:8266769")
   // compileOnly fg.deobf("curse.maven:kaleidoscope-cookery-1309203:${cookeryFileId}")
  //  runtimeOnly fg.deobf("curse.maven:kaleidoscope-cookery-1309203:${cookeryFileId}")
   // https://www.curseforge.com/minecraft/mc-mods/kaleidoscope-cookery/download/8266769 (1.4.1)
   // https://www.curseforge.com/minecraft/mc-mods/kaleidoscope-cookery/download/7966280 (1.3.0)
 //   compileOnly fg.deobf("curse.maven:kaleidoscope-nether-1417862:8015210")
   // runtimeOnly fg.deobf("curse.maven:kaleidoscope-nether-1417862:8015210")

 //   compileOnly fg.deobf("curse.maven:geckolib-388172:8285794")
   // runtimeOnly fg.deobf("curse.maven:geckolib-388172:8285794")

    // GeckoLib 编译/运行版本切换：默认 4.7（6027567）。
    // 本模组只引用 4.7 与 4.8+ 共有的 API（SingletonGeoAnimatable 等），
    // 同一份产物可同时运行在 GeckoLib 4.7 与 4.8+ 上；
    // 用 -PgeckoFileId=8285794 可切换为 4.8.4 做兼容性验证。
    // https://www.curseforge.com/minecraft/mc-mods/geckolib/download/6027567 (4.7)
    // https://www.curseforge.com/minecraft/mc-mods/geckolib/download/8285794 (4.8.4)
    def geckoFileId = providers.gradleProperty("geckoFileId").orElse("6027567").get()
    compileOnly fg.deobf("curse.maven:geckolib-388172:${geckoFileId}")
    runtimeOnly fg.deobf("curse.maven:geckolib-388172:${geckoFileId}")
    compileOnly fg.deobf("curse.maven:farmers-delight-398521:8083474")
    runtimeOnly fg.deobf("curse.maven:farmers-delight-398521:8083474")

   // compileOnly fg.deobf("curse.maven:delighto-flight-1347014:8012633")
  //  runtimeOnly fg.deobf("curse.maven:delighto-flight-1347014:8012633")
   // https://www.curseforge.com/minecraft/mc-mods/delighto-flight/download/8012633
    // https://www.curseforge.com/minecraft/mc-mods/farmers-delight/download/8083474
   // compileOnly fg.deobf("curse.maven:kaleidoscope-end-1456076:7987176")
   // runtimeOnly fg.deobf("curse.maven:kaleidoscope-end-1456076:7987176")
    //https://www.curseforge.com/minecraft/mc-mods/kaleidoscope-end/download/7987176








    // JEI

    compileOnly fg.deobf("curse.maven:jei-238222:7920915")
    runtimeOnly fg.deobf("curse.maven:jei-238222:7920915")
   // compileOnly fg.deobf("mezz.jei:jei-1.20.1-common-api:15.20.0.106")
 //   compileOnly fg.deobf("mezz.jei:jei-1.20.1-forge-api:15.20.0.106")

    runtimeOnly fg.deobf("curse.maven:jade-324717:6855440")
    // Architectury
    implementation fg.deobf("dev.architectury:architectury-forge:9.2.14")

    // === KubeJS & Rhino ===
    compileOnly fg.deobf("dev.latvian.mods:kubejs-forge:2001.6.5-build.16")
    compileOnly fg.deobf("dev.latvian.mods:rhino-forge:2001.2.3-build.10")
    if (providers.gradleProperty('withKubeJS').map { it.toBoolean() }.orElse(true).get()) {
        runtimeOnly fg.deobf("dev.latvian.mods:kubejs-forge:2001.6.5-build.16")
        runtimeOnly fg.deobf("dev.latvian.mods:rhino-forge:2001.2.3-build.10")
    }

    // 引入 Curios API (1.20.1 Forge)
    compileOnly fg.deobf("top.theillusivec4.curios:curios-forge:5.9.1+1.20.1:api")
    runtimeOnly fg.deobf("top.theillusivec4.curios:curios-forge:5.9.1+1.20.1")

// 引入 FDLib (以 1.20.1 的常用版本为例)
    // 请根据 Modrinth 上的最新版本号替换下面的版本号
   // implementation fg.deobf("maven.modrinth:fdlib:1.0.8")

    // === spark 性能分析器（仅性能排查时加载）===
    // 发布版 jar 内部是 SRG 方法名（m_xxxxx_），而 dev 运行环境（--launchTarget
    // forgeclientuserdev）是全官方映射，所以必须 fg.deobf 重映射，否则运行期会
    // NoSuchMethodError。四个 run 配置（client/client2/server/data）都继承
    // configureEach，因此都会自动带上。
    //   runClient:  gradlew runClient -PwithSpark=true   → 游戏内 /sparkc
    //   runServer:  gradlew runServer -PwithSpark=true   → 游戏内 /spark
    if (withSpark.get()) {
        runtimeOnly fg.deobf("maven.modrinth:spark:${sparkVersion}")
    }
}

// 资源替换逻辑
tasks.named('processResources', ProcessResources).configure {
    exclude '**/*.bak'
    def replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) { expand(replaceProperties) }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
// === 原生 Jar 构建逻辑 ===
// 配置 Forge 重混淆处理 shadowJar 的产物

// 恢复 jar 任务自动重混淆：否则 gradlew build 只产出 raw(未 reobf) jar，
// @Shadow 字段等会在运行期崩（oFlapTime not located）。每次构建后装 build/libs 里的 jar 即可。
tasks.named('jar').configure {
    manifest.attributes('MixinConfigs': 'herobrine_companion.mixins.json,herobrine_companion.compat.mixins.json')
    finalizedBy 'reobfJar'
}

// 避免编码错误
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.incremental = false
}

// 独立运行快速回归，不解析仅供游戏启动的 runtimeOnly 模组。
sourceSets {
    regression {
        java.setSrcDirs(['src/test/java'])
        java.include '**/*Checks.java'
        resources.setSrcDirs(['src/test/resources'])
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath = output + compileClasspath
    }
    test {
        java.exclude '**/*Checks.java'
    }
}

// 必需回归检查随仓库提交，不依赖本地 scripts/ 或额外测试框架下载。
tasks.register('verifyEndRing', JavaExec) {
    group = 'verification'
    dependsOn tasks.named('regressionClasses')
    mainClass = 'com.whitecloud233.modid.herobrine_companion.entity.logic.event.EndRingRegressionChecks'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
    classpath = sourceSets.regression.runtimeClasspath
}
tasks.named('check') { dependsOn 'verifyEndRing' }

tasks.register('verifyCombatPursuit', JavaExec) {
    group = 'verification'
    description = 'Verify ground combo continuation, flight escape and safe melee landing.'
    dependsOn tasks.named('regressionClasses')
    mainClass = 'com.whitecloud233.modid.herobrine_companion.compat.epicfight.CombatPursuitChecks'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
    classpath = sourceSets.regression.output
    args projectDir.absolutePath
}
tasks.named('check') { dependsOn 'verifyCombatPursuit' }

tasks.register('verifyProtectionAndEndRing', JavaExec) {
    group = 'verification'
    description = 'Verify protection UI sync and permanent End Ring story positioning.'
    dependsOn tasks.named('regressionClasses')
    mainClass = 'com.whitecloud233.modid.herobrine_companion.regression.ProtectionAndEndRingChecks'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
    classpath = sourceSets.regression.output
    args projectDir.absolutePath
}
tasks.named('check') { dependsOn 'verifyProtectionAndEndRing' }

tasks.register('verifyClientSyncAudit', JavaExec) {
    group = 'verification'
    description = 'Verify reward snapshots, UI acknowledgements, quest cloning and connection cleanup.'
    dependsOn tasks.named('regressionClasses')
    mainClass = 'com.whitecloud233.modid.herobrine_companion.regression.ClientSyncAuditChecks'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
    classpath = sourceSets.regression.output
    args projectDir.absolutePath
}
tasks.named('check') { dependsOn 'verifyClientSyncAudit' }

