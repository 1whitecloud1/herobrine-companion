    compileOnly "top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1:api"
    runtimeOnly "top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1"

    // 引入 Armourer's Workshop 进行测试和 API 调用 (NeoForge 1.21.1)
    // 直接传入字符串即可，无需 fg.deobf
    // 这里的 6701555 是时装工坊 1.21.1-3.2.3-beta 版本的参考 File ID，请根据需要替换为最新 ID
    compileOnly "curse.maven:armourers-workshop-229523:7165519"
    runtimeOnly "curse.maven:armourers-workshop-229523:7165519"

    compileOnly "curse.maven:epic-fight-mod-405076:8080214"
    runtimeOnly "curse.maven:epic-fight-mod-405076:8080214"
    //https://www.curseforge.com/minecraft/mc-mods/epic-fight-mod/download/8080214

    // Epic Fight Nightfall(夜幕) —— 夜幕技能系统运行时依赖(代码仅反射调用,编译期不需要)
    // https://www.curseforge.com/minecraft/mc-mods/epicfight-nightfall/download/8573921
    runtimeOnly "curse.maven:epicfight-nightfall-1307848:8573921"

    // Epic Fight Invincible(无敌) —— 无敌技能系统运行时依赖(代码仅反射调用,编译期不需要)
    // https://www.curseforge.com/minecraft/mc-mods/epic-fight-invincible/download/8390375
    runtimeOnly "curse.maven:epicfight-invincible-1184379:8390375"
}



var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.named('processResources', ProcessResources) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(JavaExec).configureEach {
    systemProperty "file.encoding", "UTF-8"
}
