        verifyConfigArchitecture: 'com.whitecloud233.herobrine_companion.architecture.ConfigArchitectureChecks',
        verifyServerConfigCodecs: 'com.whitecloud233.herobrine_companion.network.ServerConfigCodecChecks',
        verifyMemoryImport: 'com.whitecloud233.herobrine_companion.client.memory.MemoryImportChecks',
        verifyConversationImport: 'com.whitecloud233.herobrine_companion.client.service.ConversationImportChecks',
        verifyMemoryArchitecture: 'com.whitecloud233.herobrine_companion.architecture.MemoryArchitectureChecks',
        verifyArchitecture: 'com.whitecloud233.herobrine_companion.architecture.ArchitectureChecks',
        verifyGlitchText: 'com.whitecloud233.herobrine_companion.util.GlitchTextChecks',
        verifyHeroSpeechStyle: 'com.whitecloud233.herobrine_companion.client.service.HeroSpeechStyleChecks',
        verifyCompanionGuide: 'com.whitecloud233.herobrine_companion.guide.CompanionGuideChecks',
        verifyPoemGlow: 'com.whitecloud233.herobrine_companion.client.render.PoemGlowChecks',
        verifyHeroPoemAnimation: 'com.whitecloud233.herobrine_companion.client.animation.HeroPoemAnimationChecks'
]
regressionChecks.each { taskName, entryPoint ->
    tasks.register(taskName, JavaExec) {
        group = 'verification'
        dependsOn tasks.named('regressionClasses')
        mainClass = entryPoint
        javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
        classpath = sourceSets.regression.runtimeClasspath
        // 回归进程只写控制台，避免多个 JVM 与游戏争用 logs/latest.log。
        systemProperty 'log4j.configurationFile', 'log4j2-regression.xml'
        if (taskName == 'verifyPoemGlow') {
            classpath += files(tasks.named('createMinecraftArtifacts').flatMap { it.resourcesArtifact })
        }
        if (taskName == 'verifyHeroPoemAnimation') {
            // 本检查必须证明「无 Epic Fight / GeckoLib」时的真实行为，运行时要剥离这两个可选动画模组。
            classpath = sourceSets.regression.runtimeClasspath.filter { entry ->
                if (!entry.name.endsWith('.jar')) return true
                def archive = new java.util.zip.ZipFile(entry)
                try {
                    return archive.getEntry('yesman/epicfight/main/EpicFightMod.class') == null &&
                            archive.getEntry('software/bernie/geckolib/GeckoLib.class') == null
                } finally { archive.close() }
            }
        }
        // 纯源码/资源扫描的检查：不带主 runtimeClasspath，避免拉起仅供游戏启动的模组。
        if (taskName in ['verifyArchitecture', 'verifyAiArchitecture', 'verifyCookingArchitecture', 'verifyConfigArchitecture', 'verifyMemoryArchitecture', 'verifyCompanionGuide']) {
            classpath = sourceSets.regression.output
            args projectDir.absolutePath
        }
    }
}

tasks.named('check') {
    dependsOn regressionChecks.keySet()
}

// Inspect the distributable archive in isolation from development classes.
def verifyModJar = tasks.register('verifyModJar', JavaExec) {
    group = 'verification'
    description = 'Check packaged mod classes and execute hero locomotion from the distributable JAR.'
    dependsOn tasks.named('regressionClasses'), tasks.named('jar')
    mainClass = 'com.whitecloud233.herobrine_companion.packaging.ModJarChecks'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    classpath = sourceSets.regression.output
    args([tasks.named('jar', Jar).get().archiveFile.get().asFile.absolutePath] +
            sourceSets.main.output.classesDirs.files.collect { it.absolutePath })
}
tasks.named('assemble').configure { dependsOn verifyModJar }
tasks.named('check').configure { dependsOn verifyModJar }

// 真实大文件回归：需要一个外部 .litematic/.nbt 样本，故不进 check 依赖，按需手动运行。
//   gradlew verifyTemplateSample -PtemplateFixture="D:\path\to\file.litematic"
// 独立 JVM 限制为 256 MiB 堆，验证原文件的版本前置拒绝、压缩解析与方块实体保留。
tasks.register('verifyTemplateSample', JavaExec) {
    group = 'verification'
    description = 'Parses a real building template file (needs -PtemplateFixture=<path>).'
    dependsOn tasks.named('regressionClasses')
    mainClass = 'com.whitecloud233.herobrine_companion.structure.template.TemplateSampleChecks'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    classpath = sourceSets.regression.runtimeClasspath
    maxHeapSize = '256m'
    if (providers.gradleProperty('templateFixture').isPresent()) {
        args providers.gradleProperty('templateFixture').get()
    }
}
