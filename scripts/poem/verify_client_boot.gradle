// gradlew -I scripts/poem/verify_client_boot.gradle runClient --offline
// Starts the real Forge client with the current runtime mods, reaches the title screen, then exits.
allprojects { p ->
    p.afterEvaluate {
        def probe = p.sourceSets.create('poemBootProbe') {
            java.srcDir 'scripts/poem/boot_probe/java'
            resources.srcDir 'scripts/poem/boot_probe/resources'
            compileClasspath += p.sourceSets.main.compileClasspath + p.sourceSets.main.output
            runtimeClasspath += p.sourceSets.main.runtimeClasspath
        }
        def gameDir = p.layout.buildDirectory.dir('poem_boot_probe/run').get().asFile
        def report = p.layout.buildDirectory.file('poem_boot_probe/validation.json').get().asFile
        p.minecraft.runs.client {
            workingDirectory gameDir
            property 'poem.bootProbe.report', report.absolutePath
            mods {
                poem_boot_probe { source probe }
            }
        }
        p.tasks.matching { it.name == 'runClient' }.configureEach {
            dependsOn p.tasks.named(probe.classesTaskName)
            doFirst {
                gameDir.mkdirs()
                report.parentFile.mkdirs()
                report.setText('{"status":"pending"}', 'UTF-8')
                // Keep existing onboarding/display choices, while leaving the normal run directory intact.
                p.copy {
                    from p.file('run/options.txt')
                    into gameDir
                }
                p.copy {
                    from p.file('run/mods')
                    include '*.jar'
                    into new File(gameDir, 'mods')
                }
            }
            doLast {
                def result = new groovy.json.JsonSlurper().parse(report, 'UTF-8')
                if (result.status != 'passed') throw new GradleException('Poem client boot failed: ' + result)
                logger.lifecycle('POEM_CLIENT_BOOT_VERIFIED: ' + report)
            }
        }
    }
}
