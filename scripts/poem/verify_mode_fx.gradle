allprojects { p ->
    p.afterEvaluate {
        def classes = p.layout.buildDirectory.dir('poem_mode_fx/verify-classes')
        def version = p.providers.gradleProperty('minecraft_version').get().startsWith('1.20') ? 17 : 21
        def compiler = p.tasks.register('compilePoemModeFxVerifier', JavaCompile) {
            dependsOn p.tasks.named('classes')
            source = p.files('scripts/poem/PoemModeFxCheck.java')
            classpath = p.sourceSets.main.compileClasspath + p.sourceSets.main.output
            destinationDirectory = classes
            javaCompiler = p.javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(version) }
            options.encoding = 'UTF-8'
        }
        p.tasks.register('verifyPoemModeFx', JavaExec) {
            dependsOn compiler
            def withoutOptionalAnimationMods = p.sourceSets.main.compileClasspath.filter { f ->
                if (!f.name.endsWith('.jar')) return true
                def archive = new java.util.zip.ZipFile(f)
                try {
                    return archive.getEntry('yesman/epicfight/main/EpicFightMod.class') == null &&
                            archive.getEntry('software/bernie/geckolib/GeckoLib.class') == null
                } finally { archive.close() }
            }
            classpath = withoutOptionalAnimationMods + p.sourceSets.main.output + p.files(classes)
            mainClass = (version == 17 ? 'com.whitecloud233.modid.herobrine_companion' : 'com.whitecloud233.herobrine_companion') + '.client.render.PoemModeFxCheck'
            javaLauncher = p.javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(version) }
            workingDir = p.projectDir
            jvmArgs '-Djava.awt.headless=true'
        }
    }
}
