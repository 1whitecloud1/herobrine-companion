import groovy.json.JsonOutput
import groovy.json.JsonSlurper

// GeckoLib scans every JSON under assets/<namespace>/animations, even files
// our own renderer loads directly. Reject unrelated data before shipping a JAR.
// Resolve project APIs during configuration so the action can run from the configuration cache.
def resourcesRoot = sourceSets.main.output.resourcesDir
def animationResources = fileTree(resourcesRoot).matching { include 'assets/*/animations/**/*.json' }
def validationReport = layout.buildDirectory.file('poem_gecko_resource_layout/validation.json')

def verifyGeckoAnimationResources = tasks.register('verifyGeckoAnimationResources') {
    group = 'verification'
    description = 'Validate the JSON contract of all resources scanned by GeckoLib.'
    dependsOn tasks.named('processResources')
    inputs.files(animationResources).withPathSensitivity(PathSensitivity.RELATIVE)
    outputs.file(validationReport)
    doLast {
        def root = resourcesRoot
        def files = animationResources.files
        def invalid = []
        files.sort().each { file ->
            def relative = root.toPath().relativize(file.toPath()).toString().replace('\\', '/')
            try {
                def data = new JsonSlurper().parse(file, 'UTF-8')
                if (!(data instanceof Map) || !(data.animations instanceof Map)) {
                    invalid.add([path: relative, reason: 'Missing animations object required by GeckoLib'])
                }
            } catch (Exception error) {
                invalid.add([path: relative, reason: error.message])
            }
        }
        def target = validationReport.get().asFile
        target.parentFile.mkdirs()
        target.setText(JsonOutput.prettyPrint(JsonOutput.toJson([
            passed: invalid.isEmpty(), animation_files: files.size(), invalid: invalid
        ])) + '\n', 'UTF-8')
        if (!invalid.isEmpty()) {
            throw new GradleException('Invalid GeckoLib animation resources:\n' + invalid.collect {
                it.path + ': ' + it.reason
            }.join('\n'))
        }
        logger.lifecycle('GECKO_RESOURCE_LAYOUT_OK: ' + files.size() + ' animation files')
    }
}

tasks.named('check').configure { dependsOn verifyGeckoAnimationResources }
