// gradlew -I scripts/epicfight/verify_mediapipe.gradle verifyMediaPipe --offline --no-configuration-cache
allprojects { p ->
    p.afterEvaluate {
        def outputDir = p.layout.buildDirectory.dir('epicfight-mediapipe/verify-classes')
        def compileTask = p.tasks.register('compileMediaPipeVerifier', JavaCompile) {
            dependsOn p.tasks.named('classes')
            source = p.files('scripts/epicfight/MediaPipeClipCheck.java', 'scripts/epicfight/MediaPipeRegistrationCheck.java',
                    'scripts/epicfight/V6ClipCheck.java', 'scripts/epicfight/V6ReachCheck.java',
                    'scripts/epicfight/AerialDashRuntimeCheck.java', 'scripts/epicfight/UnityModesRuntimeCheck.java',
                    'scripts/epicfight/PoemInputCheck.java', 'scripts/epicfight/PoemControlEngineCheck.java', 'scripts/epicfight/UnityExtrasRuntimeCheck.java',
                    'scripts/epicfight/WomLapseOwnershipCheck.java')
            classpath = p.sourceSets.main.compileClasspath + p.sourceSets.main.output
            destinationDirectory = outputDir
            javaCompiler = p.javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(17) }
            options.encoding = 'UTF-8'
        }
        def checks = [
                verifyPoemControlEngine: 'com.whitecloud233.modid.herobrine_companion.compat.epicfight.PoemControlEngineCheck',
                verifyWomLapseOwnership: 'com.whitecloud233.modid.herobrine_companion.compat.epicfight.WomLapseOwnershipCheck',
                verifyPoemInput: 'com.whitecloud233.modid.herobrine_companion.compat.epicfight.PoemInputCheck',
                verifyUnityExtras: 'com.whitecloud233.modid.herobrine_companion.compat.epicfight.UnityExtrasRuntimeCheck',
                verifyUnityModes: 'com.whitecloud233.modid.herobrine_companion.compat.epicfight.UnityModesRuntimeCheck',
                verifyAerialDashRuntime: 'com.whitecloud233.modid.herobrine_companion.compat.epicfight.AerialDashRuntimeCheck',
                verifyMediaPipeClips: 'MediaPipeClipCheck',
                verifyMediaPipeRegistration: 'com.whitecloud233.modid.herobrine_companion.compat.epicfight.MediaPipeRegistrationCheck',
                verifyPreservedV6Clips: 'V6ClipCheck',
                verifyPreservedV6Reach: 'com.whitecloud233.modid.herobrine_companion.compat.epicfight.V6ReachCheck'
        ]
        checks.each { taskName, className ->
            p.tasks.register(taskName, JavaExec) {
                dependsOn compileTask
                classpath = p.sourceSets.main.compileClasspath + p.sourceSets.main.output + p.files(outputDir)
                mainClass = className
                javaLauncher = p.javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
                workingDir = p.projectDir
                doFirst {
                    p.file('build/epicfight-mediapipe').mkdirs()
                    p.file('build/epicfight-v6').mkdirs()
                    def epicFightJar = p.sourceSets.main.compileClasspath.find { it.name.startsWith('epic-fight-mod-405076-') }
                    new java.util.zip.ZipFile(epicFightJar).withCloseable { zip ->
                        def entry = zip.getEntry('assets/epicfight/animmodels/entity/biped.json')
                        byte[] biped = zip.getInputStream(entry).bytes
                        p.file('build/epicfight-mediapipe/biped.json').bytes = biped
                        p.file('build/epicfight-v6/biped.json').bytes = biped
                    }
                }
            }
        }
        p.tasks.register('verifyMediaPipe') {
            dependsOn checks.keySet().collect { p.tasks.named(it) }
        }
    }
}
