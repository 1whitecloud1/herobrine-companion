// Opt-in asset verification; no changes to the project's normal build.
// gradlew -I scripts/epicfight/verify.gradle verifyV4WithEpicFight --offline --no-configuration-cache
allprojects { p ->
    p.afterEvaluate {
        def outputDir = p.layout.buildDirectory.dir('epicfight-v4/verify-classes')
        def compileTask = p.tasks.register('compileV4Verifier', JavaCompile) {
            source = p.files('scripts/epicfight/V4ClipCheck.java')
            classpath = p.sourceSets.main.compileClasspath
            destinationDirectory = outputDir
            javaCompiler = p.javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(21) }
            options.encoding = 'UTF-8'
        }
        p.tasks.register('verifyV4WithEpicFight', JavaExec) {
            dependsOn compileTask
            classpath = p.sourceSets.main.compileClasspath + p.files(outputDir)
            mainClass = 'V4ClipCheck'
            javaLauncher = p.javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
            workingDir = p.projectDir
        }
    }
}
