// gradlew -I scripts/epicfight/verify_poem_1201.gradle verifyPoem1201 --offline
allprojects { p ->
    p.afterEvaluate {
        def outputDir = p.layout.buildDirectory.dir('epicfight-port/verify-classes')
        def compileTask = p.tasks.register('compilePoemVerifier', JavaCompile) {
            dependsOn p.tasks.named('classes')
            source = p.files('scripts/epicfight/V4ClipCheck.java', 'scripts/epicfight/V6ClipCheck.java',
                    'scripts/epicfight/V6RegistrationCheck.java', 'scripts/epicfight/V6ReachCheck.java',
                    'scripts/epicfight/MediaPipeClipCheck.java', 'scripts/epicfight/MediaPipeRegistrationCheck.java')
            classpath = p.sourceSets.main.compileClasspath + p.sourceSets.main.output
            destinationDirectory = outputDir
            javaCompiler = p.javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(17) }
            options.encoding = 'UTF-8'
        }
        def checks = [verifyHeroScytheClips: 'MediaPipeClipCheck', verifyPoemPlayerClips: 'V6ClipCheck',
                verifyPoemRegistration: 'com.whitecloud233.modid.herobrine_companion.compat.epicfight.V6RegistrationCheck',
                verifyPoemReach: 'com.whitecloud233.modid.herobrine_companion.compat.epicfight.V6ReachCheck']
        checks.each { taskName, className ->
            p.tasks.register(taskName, JavaExec) {
                dependsOn compileTask
                classpath = p.sourceSets.main.compileClasspath + p.sourceSets.main.output + p.files(outputDir)
                mainClass = className
                javaLauncher = p.javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
                workingDir = p.projectDir
                doFirst {
                    p.file('build/epicfight-v4').mkdirs()
                    p.file('build/epicfight-v6').mkdirs()
                    p.file('build/epicfight-mediapipe').mkdirs()
                    def epicFightJar = p.sourceSets.main.compileClasspath.find { it.name.startsWith('epic-fight-mod-405076-') }
                    new java.util.zip.ZipFile(epicFightJar).withCloseable { zip ->
                        def entry = zip.getEntry('assets/epicfight/animmodels/entity/biped.json')
                        byte[] biped = zip.getInputStream(entry).bytes
                        p.file('build/epicfight-v6/biped.json').bytes = biped
                        p.file('build/epicfight-mediapipe/biped.json').bytes = biped
                    }
                }
            }
        }
        p.tasks.register('verifyPoem1201') { dependsOn checks.keySet() }
    }
}
