// gradlew -I scripts/hero/verify_animation.gradle verifyHeroAnimation --offline
allprojects { p ->
    p.afterEvaluate {
        def classes = p.layout.buildDirectory.dir('hero_animation/verify-classes')
        def compiler = p.tasks.register('compileHeroAnimationVerifier', JavaCompile) {
            dependsOn p.tasks.named('classes')
            source = p.files('scripts/hero/HeroAnimationCheck.java')
            classpath = p.sourceSets.main.compileClasspath + p.sourceSets.main.output
            destinationDirectory = classes
            javaCompiler = p.javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(17) }
            options.encoding = 'UTF-8'
        }
        p.tasks.register('verifyHeroAnimation', JavaExec) {
            group = 'verification'
            description = 'Verify Hero walking cadence and compatibility with legacy pose NBT.'
            dependsOn compiler
            classpath = p.sourceSets.main.compileClasspath + p.sourceSets.main.output + p.files(classes)
            mainClass = 'com.whitecloud233.modid.herobrine_companion.entity.logic.data.HeroAnimationCheck'
            javaLauncher = p.javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
            workingDir = p.projectDir
            jvmArgs '-Djava.awt.headless=true'
        }
    }
}
