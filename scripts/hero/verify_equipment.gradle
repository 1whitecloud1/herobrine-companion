// gradlew -I scripts/hero/verify_equipment.gradle runServer --offline --no-configuration-cache -x downloadAssets
// The probe uses a separate local world and is never packaged in the release JAR.
allprojects { p ->
    p.plugins.withId('net.neoforged.moddev') {
        def probe = p.sourceSets.create('heroEquipmentProbe') {
            java.srcDir 'scripts/hero/equipment_probe/java'
            resources.srcDir 'scripts/hero/equipment_probe/resources'
            compileClasspath += p.sourceSets.main.compileClasspath + p.sourceSets.main.output
            runtimeClasspath += p.sourceSets.main.runtimeClasspath
        }
        def gameDir = p.layout.buildDirectory.dir('hero_equipment_probe/run').get().asFile
        def report = p.layout.buildDirectory.file('hero_equipment_probe/validation.json').get().asFile
        p.neoForge.mods.create('hero_equipment_probe') { sourceSet(probe) }
        p.neoForge.runs.configureEach { run ->
            if (run.name == 'server') {
                run.sourceSet.set(probe)
                run.gameDirectory.set(gameDir)
                run.systemProperty('hero.equipmentProbe.report', report.absolutePath)
            }
        }
        p.tasks.matching { it.name == 'runServer' }.configureEach {
            timeout = java.time.Duration.ofMinutes(4)
            dependsOn p.tasks.named(probe.classesTaskName)
            doFirst {
                gameDir.mkdirs()
                report.parentFile.mkdirs()
                report.setText('{"status":"pending"}', 'UTF-8')
                p.copy { from p.file('run/eula.txt'); into gameDir }
                new File(gameDir, 'server.properties').setText('''server-ip=127.0.0.1
server-port=0
online-mode=false
enable-status=false
enable-query=false
enable-rcon=false
level-name=equipment-test-world
level-type=minecraft:flat
generate-structures=false
spawn-protection=0
view-distance=2
simulation-distance=2
max-tick-time=120000
''', 'UTF-8')
            }
            doLast {
                def result = new groovy.json.JsonSlurper().parse(report, 'UTF-8')
                if (result.status != 'passed') throw new GradleException('Hero equipment regression failed: ' + result)
                logger.lifecycle('HERO_EQUIPMENT_VERIFIED: ' + result.assertions + ' assertions; ' + report)
            }
        }
    }
}
