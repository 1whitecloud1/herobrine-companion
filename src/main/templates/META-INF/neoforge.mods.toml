modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/1whitecloud1/herobrine-companion/issues"

[[mods]]
modId = "${mod_id}"
# 下面这一行就是让版本号自动跟随 gradle.properties 的关键
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''
${mod_description}
'''

[[mixins]]
config = "${mod_id}.mixins.json"

# ==================================
# 必需依赖项 (Required Dependencies)
# ==================================

[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# GeckoLib (终末之诗 3D 模型渲染)
[[dependencies."${mod_id}"]]
modId = "geckolib"
type = "optional"
versionRange = "[4.7,)"
ordering = "AFTER"
side = "BOTH"

# ==================================
# 可选依赖项 (Optional Dependencies)
# ==================================
# optional 允许不安装；已安装时仍由 NeoForge 在加载兼容类之前校验版本。
# 版本不满足时使用原生加载错误页面显示所需版本与当前版本。

# 饰品栏 (Curios API)
[[dependencies."${mod_id}"]]
modId = "curios"
type = "optional"
versionRange = "[9.2.0+1.21.1,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "solcarrot"
type = "optional"
versionRange = "[1.16.0,)"
ordering = "AFTER"
side = "BOTH"

# JEI 物品管理器 (Just Enough Items)
[[dependencies."${mod_id}"]]
modId = "jei"
type = "optional"
versionRange = "[19.8.4.110,)"
ordering = "AFTER"
side = "BOTH"

# KubeJS 脚本自定义
[[dependencies."${mod_id}"]]
modId = "kubejs"
type = "optional"
versionRange = "[2101.7.0-build.131,)"
ordering = "AFTER"
side = "BOTH"

# 农夫乐事：1.2.9 已实测可用；旧版砧板缺少 addItem 时使用物品栏接口回退。
[[dependencies."${mod_id}"]]
modId = "farmersdelight"
type = "optional"
versionRange = "[0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId="kaleidoscope_cookery"
type = "optional"
versionRange="[1.3.0,)"
ordering="AFTER"
side="BOTH"

# 帕秋莉手册 (Patchouli) —— 同行手册的书本载体。
# 软依赖：未安装时不发放手册，其余功能（含主页面）不受影响。
# 1.21.1 的版本号为 1.21.1-93-neoforge / 1.21-87~89-neoforge，均满足 [1.21,1.22)。
[[dependencies."${mod_id}"]]
modId="patchouli"
type = "optional"
versionRange="[1.21,1.22)"
ordering="AFTER"
side="BOTH"

[[mixins]]
config = "herobrine_companion.compat.mixins.json"

[[dependencies."${mod_id}"]]
modId = "accessories"
type = "optional"
versionRange = "[0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "armourers_workshop"
type = "optional"
versionRange = "[0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "epicfight"
type = "optional"
versionRange = "[0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "simplehats"
type = "optional"
versionRange = "[0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "waveycapes"
type = "optional"
versionRange = "[0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "wom"
type = "optional"
versionRange = "[0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "efn"
type = "optional"
versionRange = "[0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "epic_fight_avalon"
type = "optional"
versionRange = "[0,)"
ordering = "AFTER"
side = "BOTH"
