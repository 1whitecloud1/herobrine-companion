# Keep the resource and template copies synchronized.
# Gradle processes src/main/resources/META-INF/mods.toml.
modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/WhiteCloud233/herobrine-companion-mod/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''
A companion mod for Herobrine.
'''

# Required platform dependencies.
[[dependencies."${mod_id}"]]
modId = "forge"
mandatory = true
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# Optional integrations. Lower bounds follow the 1.20.1 compatibility audit.
# Historical API checks do not guarantee compatibility with all future releases.
[[dependencies."${mod_id}"]]
modId = "kubejs"
mandatory = false
versionRange = "[2001.6.2-build.8,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "patchouli"
mandatory = false
versionRange = "[1.20.1-84,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "solcarrot"
mandatory = false
